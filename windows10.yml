services:
  windows:
    image: dockurr/windows
    container_name: windows

    environment:
      VERSION: "10"
      USERNAME: "pcuser"
      PASSWORD: "PcUser123!"
      RAM_SIZE: "6G"
      CPU_CORES: "2"

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"

    volumes:
      - windows-data:/storage

    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"

    stop_grace_period: 2m

volumes:
  windows-data:
